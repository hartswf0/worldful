var idx = 0;

function go(k) {
  if (!secs || !secs.length) {
    var d = document.getElementById('deck');
    if (d) secs = [...d.children];

  idx = Math.max(0, Math.min((secs.length || 18) - 1, k));

In a media room, a user wearing a magnetic wrist tracker points at a large screen and says: "Create a blue square there... Put that there."

Notice what happened: the phrase "Put that there" contains almost no descriptive information. There are no coordinates, no RGB values, no object IDs. It works because meaning is completed by the physical situation: words + gesture + timing + shared scene + system capability. 

Wittgenstein recognized this in 1953. In Philosophical Investigations §8, he expands the builder's game: Builder A calls out "d—slab—there," shows a colour sample, and points.

NOTES_DATA.push({
  target: "09:30",
  script: `Now to the theoretical wager: what is **Operative Description**?

For centuries, description was understood in the humanities as representational—a model *of* reality, word-to-world (d↓). In Anscombe's terms, the detective's list: if the detective writes butter when the shopper bought margarine, the mistake is in the text.

In generative systems, description becomes a model *for* reality, world-to-word (d↑)—Anscombe's shopping list. Description participates directly in producing, compiling, and transforming what it names.

Crucially: Conventional programming requires the language game to precede execution (types, compilers, syntax must be fixed in advance). 
Generative interaction can **negotiate parts of the game during execution**. 

When a model outputs an unexpected result, and the human says 'not that, closer to the wall,' criticism becomes the hinge between the word-to-world and world-to-word directions.`
