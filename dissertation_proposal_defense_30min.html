// SLIDE 01: TITLE & CORE DEFENSE THESIS
S_DEFENSE.push(`<section class="end">
  <span class="kind">PH.D. PROPOSAL DEFENSE · 30 MIN</span>
  <span class="timing">00:00 – 01:30</span>
  <h1 style="font-size:clamp(22px,4.5vw,56px)">Operative Description in Generative Media</h1>
  <p class="sub" style="font-size:clamp(14px,1.8vw,22px)">Worldtext, Thick Prompting, and the Making of Generated Worlds</p>
  <div class="inv" style="margin:8px 0; max-width:76ch; background:var(--paper-soft); border-left:4px solid var(--teal)">
    <b>THE DISSERTATION BLADE:</b><br>
    “In generative media systems, description no longer merely represents worlds; it operates systems that generate, revise, stabilize, and contest worlds.”
  </div>
  <p style="font-size:0.86em"><b>Contribution:</b> Operative description and thick prompting as a theory-method pair for studying <i>worldtext</i>.</p>
  <footer>Watson Hartsoe · Chair: Dr. Jay David Bolter · School of Literature, Media, and Communication · Georgia Tech · 2026</footer>
</section>`);
NOTES_DATA.push({
  target: "01:30",
  script: `Good morning, members of the committee. 

The title of this dissertation proposal is "Operative Humanities and the Construction of Language Games."

I want to begin with a radical refusal: I do not study prompts. 
Prompts are not an intellectual discipline. In five years, foundation models will run on autonomous agent loops, sensory embeddings, and multimodal tool-use where the single natural language prompt string will be largely obsolete. 

Instead, this dissertation addresses the structural crisis underneath that interface: the fact that natural language computing has collapsed dozens of historically distinct communicative practices into a single undifferentiated rectangle. 

My thesis is that a prompt is merely an under-specified move inside an unacknowledged game. The humanistic and technical contribution of this work is the construction of the operational environments—the rules, the state, the validators, and the apparatus—in which language acquires consequence.`
});

// SLIDE 02: THE CANONICAL UTTERANCE
S_DEFENSE.push(`<section>
  <span class="kind">ACT I · THE APERTURE CRITIQUE</span>
  <span class="timing">01:30 – 03:00</span>
  <div class="big">Draw a circle.</div>
  <div class="readings">${[
    'an order.',
    'a unit test.',
    'a score.',
    'a dare.',
    'a benchmark.',
    'a constraint.',
    'a live demonstration before a committee.',
    'an opening move in a negotiation over geometry.'
  ].map((r, i) => `<span class="${i ? '' : 'on'}">${r}</span>`).join('')}</div>
  <p>Same four words. Read them as text and you cannot tell which you are holding. Play them inside an operational system and you can.</p>
  <div class="defense-point" style="margin-top:10px">
    <b>The Hermeneutic Blindspot:</b> The interface treats "Draw a circle" as uniform syntax. But each interpretation establishes a completely different authority structure, success condition, and failure penalty.
  </div>
</section>`);
NOTES_DATA.push({
  target: "03:00",
  script: `Consider these four words: "Draw a circle."

If you read them as a text string, you cannot tell what they are.
Are they an imperative command to drafting software? 
Are they a unit test probing latent spatial representation?
Are they an artistic score with generative latitude, like Sol LeWitt?
Or are they a geometric constraint where non-circular output is forbidden?

The prevailing paradigm in AI interaction—what we might call 'prompt engineering'—assumes that if we parse the words harder, or engineer a clever prefix, we can disambiguate the intent. 

That is an epistemic mistake. Meaning does not live in the four words. Meaning lives in the operational game constructed around them. When the interface flattens all of these into identical monospace typography, it forces the underlying model to guess which game is in force.`
});

// SLIDE 03: GEERTZ MODEL OF VS MODEL FOR
S_DEFENSE.push(`<section>
  <span class="kind">THEORETICAL GROUNDING</span>
  <span class="timing">03:00 – 05:00</span>
  <h2>Clifford Geertz: Model <i>of</i> vs. Model <i>for</i></h2>
  <div class="grid-2">
    <div class="box-cell">
      <span class="box-tag" style="background:var(--teal)">MODEL OF REALITY (d↓)</span>
      <b>Word-to-World (Anscombe's Detective)</b>
      <p>Descriptive representation, truth-evaluable, accountable to an existing reality. If text and world diverge, <i>the mistake is in the text</i>.</p>
      <small>Probe · Retrieval (RAG) · Empirical Audit</small>
    </div>
    <div class="box-cell">
      <span class="box-tag" style="background:var(--amber)">MODEL FOR REALITY (d↑)</span>
      <b>World-to-Word (Anscombe's Shopper)</b>
      <p>Directive blueprint, programmatic actuation, intervention. If text and world diverge, <i>the mistake is in the world</i>.</p>
      <small>Instruction · Program · Tool Execution</small>
    </div>
  </div>
  <div class="rebuttal" style="margin-top:8px">
    <b>The Ontological Crash:</b> Foundation models are trained under assertive loss (d↓, predicting tokens in past text) but deployed as directive actuators (d↑, invoking APIs and making binding contracts). The prompt box conceals this reversal.
  </div>
</section>`);
NOTES_DATA.push({
  target: "05:00",
  script: `To formalize why this collapse causes catastrophic failure, I draw on anthropologist Clifford Geertz and philosopher G.E.M. Anscombe.

In 'The Interpretation of Cultures,' Geertz shows that cultural symbols have an intrinsic double aspect: they function simultaneously as a *model of* reality, and a *model for* reality.

Anscombe formalized this distinction in 1957 through the famous parable of the shopping list. 
A man walks through a market with a list of groceries. This is a *model for* reality—a directive (d↑). If he buys margarine instead of butter, the mistake is in his performance, not in the list.
Following behind him is a detective making a record of what he buys. This is a *model of* reality—an assertive (d↓). If the detective writes butter when the man bought margarine, the mistake is in the record.

Here is the central engineering paradox of modern AI: 
Large language models are pre-trained entirely under assertive loss (d↓)—they are trained to model existing corpora. Yet industry deploys them as directive actuators (d↑)—letting them write code, buy airline tickets, and issue legal promises. 
When the prompt box erases this distinction, the system inevitably hallucinates.`
});

// SLIDE 04: THE HOSTILE INTERROGATION: REFUSING TAXONOMY
S_DEFENSE.push(`<section>
  <span class="kind">SCOPE BOUNDARY</span>
  <span class="timing">05:00 – 06:30</span>
  <h2>Contribution Boundary: Scope & Constraints</h2>
  <div class="grid-2">
    <div class="box-cell" style="border-color:var(--teal)">
      <span class="box-tag" style="background:var(--teal)">WHAT THIS CONTRIBUTION IS</span>
      <p>✓ Theory of <b>operative description</b></p>
      <p>✓ Method of <b>thick prompting</b></p>
      <p>✓ Vocabulary for <b>worldtext</b></p>
      <p>✓ Practice-based study of generative media</p>
      <p>✓ Analysis of prompt-output-revision loops</p>
      <p>✓ Framework for steering generated worlds</p>
    </div>
    <div class="box-cell" style="border-color:var(--red); background:var(--red-dim)">
      <span class="box-tag" style="background:var(--red); color:var(--paper)">WHAT THIS CONTRIBUTION IS NOT</span>
      <p>✕ A claim that I invented prompting</p>
      <p>✕ A claim that I invented AI storytelling</p>
      <p>✕ A general history of all generative AI</p>
      <p>✕ A technical benchmark of model performance</p>
      <p>✕ A universal theory of creativity</p>
      <p>✕ An “everything bagel” dissertation</p>
    </div>
  </div>
  <div class="defense-point" style="margin-top:8px">
    <b>The Scope Defense:</b> Refuses taxonomy as the product. The 12 games are Weberian ideal types used to isolate specific execution conditions under load.
  </div>
</section>`);
NOTES_DATA.push({
  target: "06:30",
  script: `Now, I want to address directly the boundary of this dissertation: what this contribution is, and what it is emphatically not.

This is not a claim that I invented prompting, or that I invented AI storytelling. It is not a technical benchmark of FLOPs or benchmark scores, and it is not an 'everything bagel' dissertation trying to cover all of generative AI.

The contribution is bounded to three things:
A theory of operative description;
A method of thick prompting;
And an object of study called worldtext.

The twelve language games are not an ontology; they are Weberian ideal types used to isolate specific execution conditions. The research object is the falsifiable transition when an operative boundary breaks.` 

Following Max Weber, these twelve games are *ideal types* (Idealtypus). An ideal type is not an empirical average or a normative ideal; it is a deliberate, one-sided conceptual accentuation designed to measure real-world friction. 

The empirical reality of human-AI encounter is never a pure card. It is **interactional drift**. 
A user begins with a Query. When the query fails, they drift into a Conversation. When conversation becomes vague, they drift into a Program by defining explicit rules. When the rules break, they drift into an Edit or a Constraint.

The object of this dissertation is not the twelve labels. The object is the **switchyard**—the falsifiable conditions under which one communicative regime breaks and transforms into another.`
});

// SLIDE 05: WHAT IS OPERATIVE HUMANITIES?
S_DEFENSE.push(`<section>
  <span class="kind">ACT II · THE METHOD</span>
  <span class="timing">06:30 – 08:30</span>
  <h2>What is the Operative Humanities?</h2>
  <div class="grid-2">
    <div class="box-cell">
      <span class="box-tag">TRADITIONAL HUMANITIES</span>
      <b>Post-Hoc Critical Commentary</b>
      <p>Analyzes artifacts, discourse, and power dynamics after software has shipped. Critique remains external, descriptive, and politically toothless.</p>
    </div>
    <div class="box-cell" style="border-color:var(--teal); background:var(--teal-dim)">
      <span class="box-tag" style="background:var(--teal)">OPERATIVE HUMANITIES</span>
      <b>Hermeneutic Engineering</b>
      <p>Builds the execution conditions. Compiles philosophical concepts (intention, reference, authority) into running runtimes, testbenches, and validators.</p>
    </div>
  </div>
  <p style="margin-top:10px"><b>The Methodological Principle:</b> If a sentence can change a database, steer a robotic arm, or produce legal liability, then <i>interpretation must include the computational execution apparatus</i>.</p>
</section>`);
NOTES_DATA.push({
  target: "08:30",
  script: `This brings us to the core methodology of the dissertation: the **Operative Humanities**.

For forty years, digital humanities and media studies have operated primarily through post-hoc critique: observing commercial technologies from a safe distance, publishing critical essays, and lamenting ethical harms after the software is deployed.

The Operative Humanities rejects this passive stance. 
The adjective 'operative' does not mean that the humanities should abandon critical theory and become subservient to computer science. 
It means that **interpretation must now include execution conditions**. 

When language is connected to neural networks with tool-use APIs, speech acts become mechanical acts. If an utterance can mutate a database, allocate a budget, or bind an airline in court, the meaning of that utterance is inseparable from the computational runtime through which it executes.

In the Operative Humanities, we build computational testbenches as hermeneutic instruments. We write code not just to deploy tools, but to test where philosophical concepts like reference, authority, and agency break under the weight of implementation.`
});

// SLIDE 06: STAGING ENCOUNTERS
S_DEFENSE.push(`<section>
  <span class="kind">THE METHODOLOGICAL SCAFFOLD</span>
  <span class="timing">08:30 – 10:30</span>
  <h2>Method: Staging Encounters</h2>
  <p>We do not "talk to an AI." We stage a bounded encounter between a human subject and an alien probabilistic substrate. Every encounter requires settling five invariant boundaries:</p>
  <div class="inv" style="max-width:68ch">
1 · AUTHORITY DISTRIBUTION  ──▶ Who specifies, who acts, who bears legal liability?
2 · PERMISSIBLE MOVE SET    ──▶ What syntactic and gestural acts count as a valid turn?
3 · MACHINE LATITUDE        ──▶ Is the model an actuator, an oracle, or an instrument?
4 · EXTERNAL VALIDATOR      ──▶ What checkable reality outside the token stream vetoes the result?
5 · TERMINATION CONDITION   ──▶ What concrete friction ends the encounter?
  </div>
  <p><small><b>The Operational Definition of a Game:</b> A language game is the explicit architecture of these five settings built before the first prompt token is emitted.</small></p>
</section>`);
NOTES_DATA.push({
  target: "10:30",
  script: `How do we practice this? Through a method I call **Staging Encounters**.

When someone sits down at ChatGPT, the interface tells them: "You are having a conversation with an assistant." That is a dangerous corporate myth. 

You are not having a conversation. You are staging an encounter with a 70-billion-parameter probabilistic token generator. 

In my studio practice, before a single move is made, we must explicitly construct the five boundaries of the encounter:
First: Authority distribution. Who specifies, who executes, and who holds legal liability?
Second: The permissible move set. What counts as a turn? Text, cursor movements, AST diffs, or physical gestures?
Third: Machine operational latitude. Is the model allowed generative variance (like an artist's score), or is it clamped to zero latitude?
Fourth: The external validator. What fact in the world—a compiler, a database, a camera, a physical sensor—is authorized to kill the output?
Fifth: The termination condition. What concrete friction halts execution?

When you change these five settings, the same sentence does entirely different work. That five-part boundary is the actual design artifact.`
});

// SLIDE 07: EXTENDED CORRESPONDENCE (TIM INGOLD)
S_DEFENSE.push(`<section>
  <span class="kind">ANTHROPOLOGICAL DEPTH</span>
  <span class="timing">10:30 – 12:00</span>
  <h2>Extended Correspondence (Tim Ingold)</h2>
  <div class="grid-2">
    <div class="box-cell">
      <span class="box-tag">SHANNON-WEAVER CYBERNETICS</span>
      <b>Transmission Across a Void</b>
      <p>Information as encoded bits sent from sender to receiver. Assumes pre-formed mental intent downloaded into a passive medium.</p>
    </div>
    <div class="box-cell" style="border-color:var(--blue); background:var(--blue-dim)">
      <span class="box-tag" style="background:var(--blue)">INGOLD: CORRESPONDENCE</span>
      <b>Living Along Lines of Friction</b>
      <p>Languaging as continuous attunement and mutual answering-back. Meaning emerges from wrestling with the material grain of the medium.</p>
    </div>
  </div>
  <div class="defense-point" style="margin-top:10px">
    <b>Ingold's Attentionality:</b> Prompting is not command-and-control. It is an extended correspondence where the practitioner discovers what they are doing only through the machine's surprising resistance.
  </div>
</section>`);
NOTES_DATA.push({
  target: "12:00",
  script: `To ground this interactional dynamic, I turn to anthropologist Tim Ingold's concept of **Correspondence**.

Computer science has been trapped for seventy years in the Shannon-Weaver transmission model of communication: an author has a frozen thought in their skull, encodes it into prompt tokens, transmits it across a wire, and an AI decodes it.

deck.innerHTML = S_DEFENSE.join('');
const secs = [...deck.children];
let idx = 0;

function go(k) {
  idx = Math.max(0, Math.min(secs.length - 1, k));
  secs[idx].scrollIntoView({ behavior: 'smooth' });
  updateNotes();
}

addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', ' ', 'PageDown'].includes(e.key)) {
    e.preventDefault();
    go(idx + 1);
  }
  if (['ArrowLeft', 'ArrowUp', 'PageUp'].includes(e.key)) {
    e.preventDefault();
    go(idx - 1);
  }
  if (e.key === 'n' || e.key === 'N') {
    toggleNotes();
  }
  if (e.key === 'c' || e.key === 'C') {
    toggleCite();
  }
  if (e.key === 't' || e.key === 'T') {
    toggleTimer();
  }
});

deck.addEventListener('click', e => {
  if (e.target.closest('#hud') || e.target.closest('#notes-panel') || e.target.closest('#cite-modal')) return;
  if (e.clientX < innerWidth * 0.25) go(idx - 1);
  else go(idx + 1);
});

deck.addEventListener('scroll', () => {
  idx = Math.round(deck.scrollTop / deck.clientHeight);

      const m = String(Math.floor(timerSecs / 60)).padStart(2, '0');
      const s = String(timerSecs % 60).padStart(2, '0');
      disp.innerText = `${m}:${s}`;
      if (timerSecs > 1800) disp.style.color = 'var(--red)';
    }, 1000);
    disp.style.background = 'var(--amber-dim)';
  }
}
