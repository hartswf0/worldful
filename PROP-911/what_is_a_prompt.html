t-size:clamp(45px,7vw,100px);font-weight:900;writing-mode:vertical-rl;transform:rotate(180deg);justify-self:center}.links{display:grid;gap:11px}.links a{font-size:clamp(18px,2.2vw,30px);font-weight:800;text-decoration:none;border-bottom:1px solid var(--i);padding:9px 0}.operation,.wm{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:16px;align-items:center;width:min(1100px,94%);text-align:center;font-size:clamp(18px,3vw,46px);font-weight:900;letter-spacing:-.03em}.under{position:absolute;top:58%;transform:scale(.72);opacity:.4}.wm{font-size:clamp(24px,4vw,58px);line-height:.92}.browser{width:min(1120px,92vw);height:min(61vh,650px);background:#fff;border:1px solid #aaa;box-shadow:0 9px 30px #0002;overflow:hidden}.bar{height:28px;background:#e9e6df;border-bottom:1px solid #c9c5bc;display:flex;align-items:center;gap:6px;padding:0 9px;color:#6f6a60;font-size:9px}.bar i{width:8px;height:8px;border-radius:50%;background:#b9b4aa}.bar b{margin-left:6px}.browser iframe{width:100%;height:calc(100% - 28px);border:0}.wag{width:min(1160px,94%);display:grid;gap:25px}.pipe{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}.pipe span{font-size:clamp(24px,3.4vw,48px);font-weight:900;letter-spacing:-.04em}.pipe b{font-size:28px;font-weight:300}.cards{display:grid;grid-template-columns:1fr 1fr .8fr;gap:11px}.cards a{min-height:190px;border:1px solid var(--l);color:var(--i);text-decoration:none;background:#fff;display:flex;flex-direction:column;overflow:hidden}.cards img{width:100%;height:145px;object-fit:cover;filter:saturate(.75)}.cards strong{font-size:13px;letter-spacing:.08em;padding:9px 10px 3px}.cards small{font:italic 12px Georgia,serif;padding:0 10px 10px;color:var(--m)}.cards .text{justify-content:center;padding:20px}.cards .text strong{font-size:clamp(20px,2.5vw,34px);padding:0}.cards .text small{font-size:15px;padding:7px 0}.worldtext{display:grid;grid-template-columns:1fr auto 1fr;gap:7vw;align-items:center;text-align:center;width:min(900px,90%)}.it,.wt{font-size:clamp(46px,7vw,100px);font-weight:900;line-height:.78;letter-spacing:-.06em}.wt{color:var(--r)}.demo{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;gap:8px;width:min(900px,90%)}.demo a{flex:1;text-align:center;text-decoration:none;border-top:1px solid var(--i);padding-top:7px}.demo b{display:block;font-size:10px;letter-spacing:.15em}.demo span{font:italic 11px Georgia,serif;color:var(--m)}.def{display:grid;grid-template-columns:auto auto 1fr;gap:4vw;align-items:center;width:min(1100px,92%)}.def .word{font-size:clamp(50px,9vw,125px);font-weight:900;letter-spacing:-.07em}.eq{font-size:clamp(45px,7vw,90px);font-weight:300}.parts{display:grid;gap:5px}.parts span{font-size:clamp(20px,3vw,42px);font-weight:850;border-bottom:1px solid var(--i);padding:4px 0}.final{position:absolute;bottom:13px;font:italic clamp(20px,2.6vw,34px) Georgia,serif}.dots{position:fixed;right:13px;top:50%;transform:translateY(-50%);z-index:10;display:flex;flex-direction:column;gap:5px}.dots button{width:7px;height:7px;border:0;border-radius:50%;padding:0;background:#bdb6a9}.dots button.on{background:var(--i);transform:scale(1.35)}

<script>
const S=[
{t:'WHAT IS A PROMPT?',k:'01',h:`<div class="mega">WHAT IS<br>A PROMPT?</div>`,a:'Opening question.',u:'#',f:'Do not define it yet. Test several candidates: command, description, score, situated move, program, negotiation, and world-model construction.'},
{t:'BUILDERS’ GAME',k:'02 · WITTGENSTEIN',h:`<div class="builder"><div class="call">SLAB!</div><div class="arr">→</div><div class="slab"></div></div><div class="claim">Meaning is in the continuation.</div>`,a:'After Ludwig Wittgenstein, Philosophical Investigations §2.',u:'https://plato.stanford.edu/entries/wittgenstein/#LangGameFamiRese',f:'The builder and assistant use block, pillar, slab, beam. “Slab” functions inside an activity. First hypothesis: a prompt is a linguistic move whose meaning is completed by what another participant does next.'},
{t:'SHRDLU',k:'03 · WINOGRAD',h:`<div class="shrdlu"><div class="prompt">PICK UP THE BIG RED BLOCK.</div><div class="world"><div class="blk r b1"></div><div class="blk g b2"></div><div class="blk bu b3"></div><div class="pyr"></div></div></div><div class="claim">Words have consequences because there is a world to refer to.</div>`,a:'Terry Winograd, SHRDLU / blocks world, 1969–72. Diagram reconstructed here.',u:'http://hci.stanford.edu/winograd/shrdlu/',f:'SHRDLU couples language to a bounded microworld in which objects, relations, plans, and actions are available. The prompt is text plus a world in which the text can be resolved.'},
{t:'PUT THAT THERE',k:'04 · BOLT',h:`<div class="video"><iframe src="https://www.youtube.com/embed/RyBEUyEtxQo?rel=0" title="Put That There" allowfullscreen></iframe></div><div class="claim">“That” and “there” mean almost nothing without the situation.</div>`,a:'Richard A. Bolt, Put-That-There, MIT Architecture Machine Group, 1980.',u:'https://doi.org/10.1145/800250.807503',f:'Voice and pointing jointly bind pronouns to objects and places. Prompt meaning is distributed across utterance, gesture, screen state, body position, and prior interaction.'},
{t:'DESCRIPTION GAMES',k:'05 · PARTIAL WORLDS',h:`<div class="img"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Blind%20monks%20examining%20an%20elephant.jpg" alt="Blind monks examining an elephant"></div><div class="claim">Every description selects a world.</div>`,a:'Hanabusa Itchō, Blind monks examining an elephant. Public-domain reproduction via Wikimedia Commons.',u:'https://commons.wikimedia.org/wiki/File:Blind_monks_examining_an_elephant.jpg',f:'Each observer describes correctly from a partial relation to the whole. Prompting is a description game: what is named, omitted, foregrounded, measurable, or available to the executor changes the world that can follow.'},
{t:'THIN / THICK',k:'06 · RYLE',h:`<div class="eyes"><div class="eye"><div class="pupil"></div></div><div class="neq">≠</div><div class="eye wink"><div class="pupil"></div></div></div><div class="twocol"><div><b>THIN</b><span>eyelid contracts</span></div><div><b>THICK</b><span>secret signal to an accomplice</span></div></div>`,a:'After Gilbert Ryle’s wink/twitch example, developed by Clifford Geertz.',u:'https://plato.stanford.edu/entries/ryle/',f:'The visible movement can be the same while the act is different. Context, intention, code, audience, and stakes are not decoration around the action. They are part of what action it is.'},
{t:'THE COCKFIGHT',k:'07 · GEERTZ',h:`<div class="img"><img src="https://commons.wikimedia.org/wiki/Special:FilePath/Cockfighting%2C%20Bali%20Where%2C%20What%2C%20When%2C%20How%2C%20p8.jpg" alt="Cockfighting in Bali"></div><div class="claim">The same visible event can carry an entire social world.</div>`,a:'Cockfighting, Bali, c. 1958, Indonesian Ministry of Information, public domain. Concept: Clifford Geertz.',u:'https://direct.mit.edu/daed/article/134/4/56/27395/Deep-play-notes-on-the-Balinese-cockfight',f:'Geertz’s point is not “add more detail.” Thick description reconstructs the layered structures through which an event becomes intelligible to participants. That distinction is useful for prompting.'},
{t:'THICK PROMPTING',k:'08 · PROPOSAL',h:`<div class="formula"><div class="thin">MAKE A HOUSE.</div><div class="down">↓</div><div class="chips"><span>WORLD</span><span>RELATIONS</span><span>INTENTION</span><span>CONSTRAINTS</span><span>TEST</span></div></div><div class="claim">Not more adjectives. More of the situation.</div>`,a:'Thick prompting: proposed extension of Ryle/Geertz to human–AI instruction.',u:'https://plato.stanford.edu/entries/ryle/',f:'A thick prompt exposes the context that makes an intended continuation legible: what world we are in, what relations hold, what is being attempted, what must remain invariant, and what would count as success.'},
{t:'A PROMPT CAN BE A SCORE',k:'09 · EXECUTION WITHOUT DETERMINISM',h:`<div class="score"><img src="https://www.getty.edu/publications/scores/iiif/fig-6-2/r32814_890164_127_003/static-inline-commentary-image.jpg" alt="George Brecht event score"><div class="vertical">SCORE</div><div class="links"><a href="https://www.computerhistory.org/timeline/1963/" target="_blank">BEFLIX ↗</a><a href="https://hartswf0.github.io/k2.html/inner-ear.html" target="_blank">INNER EAR ↗</a><a href="https://hartswf0.github.io/moto/all-time.html" target="_blank">ALL-TIME ↗</a></div></div><div class="claim">A score constrains a performance without exhausting it.</div>`,a:'George Brecht event-score lineage; Ken Knowlton’s BEFLIX; Watson Hartsoe, Inner Ear and All-Time.',u:'https://www.getty.edu/publications/scores/06/commentary/',f:'A score may be a better model for many prompts than “program.” It can be precise about relations and timing while leaving interpretation to a performer, model, instrument, or environment.'},
{t:'OPERATIVE EKPHRASIS',k:'10 · HOMER',h:`<div class="img"><img src="https://data.fitzmuseum.cam.ac.uk/imagestore/aa/aa20/M_1_1842.jpg" alt="Shield of Achilles reconstruction"></div><div class="claim">What if description does not stop at representation?</div>`,a:'Shield of Achilles reconstruction after Homer; John Flaxman design. Fitzwilliam Museum.',u:'https://data.fitzmuseum.cam.ac.uk/id/object/12198',f:'Ekphrasis makes an absent or imagined object present through words. Operative ekphrasis names the stronger case in which description becomes input to a process that produces, modifies, or navigates what is described.'},
{t:'OPERATION: DESCRIBE',k:'11 · DESCRIPTION ENTERS AN APPARATUS',h:`<div class="operation"><div>DESCRIPTION</div><div class="arr">→</div><div>INTERPRETER</div><div class="arr">→</div><div>WORLD</div></div><div class="operation under"><div>WORLD</div><div class="arr">→</div><div>EVIDENCE</div><div class="arr">→</div><div>REVISION</div></div><div class="claim">The operation is a loop, not a spell.</div>`,a:'Operation Describe / operative-builder research trace, Watson Hartsoe.',u:'https://hartswf0.github.io/gunnars-depot.html/operative-builder-trace.html',f:'Description gains operational force inside an apparatus that can interpret it, act, expose a result, and admit correction. The prompt is closer to an experimental move than a magic incantation.'},
{t:'WORD MODELS → WORLD MODELS',k:'12 · WONG, TENENBAUM ET AL.',h:`<div class="wm"><div>NATURAL<br>LANGUAGE</div><div class="arr">→</div><div>PROBABILISTIC<br>PROGRAM</div><div class="arr">→</div><div>WORLD<br>MODEL</div></div><div class="claim">Tug of war: prose can construct the model that later supports inference.</div>`,a:'Lionel Wong et al., From Word Models to World Models, 2023.',u:'https://arxiv.org/abs/2306.12672',f:'The paper treats linguistic meaning as a context-sensitive mapping into a probabilistic language of thought and explores language constructing new world models. This is “word to world” in a technically literal sense.'},
{t:'CORRESPONDENCE',k:'13 · CALL YOUR SHOTS',h:`<div class="browser"><div class="bar"><i></i><i></i><i></i><b>operative-builder-trace.html</b></div><iframe src="https://hartswf0.github.io/gunnars-depot.html/operative-builder-trace.html" title="Operative Builder Trace"></iframe></div><div class="claim">A prompt needs a test.</div>`,a:'Watson Hartsoe, Operative Builder Trace.',u:'https://hartswf0.github.io/gunnars-depot.html/operative-builder-trace.html',f:'Without correspondence criteria, every output can be rationalized after the fact. The trace makes description a visible wager: state the intended relation, execute it, inspect the world, revise.'},
{t:'NEGOTIATION',k:'14 · CENTAUR BOX',h:`<div class="video"><iframe src="https://www.youtube.com/embed/hdTEJSyZahs?rel=0" title="Centaur Box Experiment" allowfullscreen></iframe></div><div class="claim">Prompting is not transmission. It is recursive negotiation.</div>`,a:'Watson Hartsoe with Tony Assi, Thinking Outside the AI Box: The Centaur Box Experiment.',u:'https://www.youtube.com/watch?v=hdTEJSyZahs',f:'The Centaur Box foregrounds gatekeepers, persuasion, adaptation, and recursive model–human strategy. A prompt can be a move in a negotiation where both sides update.'},
{t:'WORDS → WORLDS',k:'15 · WAGYO / WAG / MARIO',h:`<div class="wag"><div class="pipe"><span>WORDS</span><b>→</b><span>GEOMETRY</span><b>→</b><span>IMAGE</span><b>→</b><span>MOTION</span></div><div class="cards"><a href="https://www.youtube.com/watch?v=yZ_IZS9_pfI" target="_blank"><img src="https://img.youtube.com/vi/yZ_IZS9_pfI/hqdefault.jpg"><strong>WAGYO</strong><small>chat canvas → worlds</small></a><a href="https://www.youtube.com/watch?v=h-OGQ_dDJ4c" target="_blank"><img src="https://img.youtube.com/vi/h-OGQ_dDJ4c/hqdefault.jpg"><strong>SUPER MARIO N64</strong><small>text → 3D + music</small></a><a class="text" href="https://hartswf0.github.io/halfworld/halfworld-index.html" target="_blank"><strong>CARROT UPRISING</strong><small>LDraw text → geometry → image → video</small></a></div></div>`,a:'Watson Hartsoe: Wagyo; AI Made Super Mario N64; Carrot Uprising / WAG (Words Assemble Geometry).',u:'https://www.youtube.com/watch?v=yZ_IZS9_pfI',f:'These demos make correspondence visible by inserting structured intermediate representations. The prompt establishes geometry or another score that constrains what later generators may do.'},
{t:'IMAGETEXT → WORLDTEXT',k:'16 · PROMPT DIALECTS',h:`<div class="worldtext"><div class="it">IMAGE<br>+<br>TEXT</div><div class="arr">→</div><div class="wt">WORLD<br>+<br>TEXT</div></div><div class="demo"><a href="https://hartswf0.github.io/halfworld/halfworld-index.html" target="_blank"><b>HALFWORLD</b><span>scene / film / score</span></a><a href="https://hartswf0.github.io/odyssey-halfworld/index.html" target="_blank"><b>ODYSSEY</b><span>character / world</span></a><a href="https://hartswf0.github.io/k2.html/inner-ear.html" target="_blank"><b>INNER EAR</b><span>language / music</span></a></div>`,a:'Worldtext: Watson Hartsoe, extending the image/text problem toward language coupled to operable worlds.',u:'https://hartswf0.github.io/halfworld/halfworld-index.html',f:'The shift is not merely words to pictures. Worldtext asks what happens when language and a manipulable world become mutually addressable: text alters the world, and the world returns evidence that changes the next text.'},
{t:'WHAT IS A PROMPT?',k:'17 · WAGER',h:`<div class="def"><div class="word">PROMPT</div><div class="eq">=</div><div class="parts"><span>DESCRIPTION</span><span>SITUATION</span><span>EXECUTOR</span><span>TEST</span></div></div><div class="final">Prompting is negotiation over correspondence.</div>`,a:'Working definition for Operative Humanities / Operation Describe.',u:'https://hartswf0.github.io/gunnars-depot.html/operative-builder-trace.html',f:'A prompt is an operational description offered inside a situation to an interpreter capable of producing a continuation whose adequacy can be judged. Its force does not reside in the words alone.'}
];
const root=document.getElementById('slides'),dots=document.getElementById('dots');let i=Math.max(0,Math.min(S.length-1,(parseInt(location.hash.slice(1))||1)-1));
S.forEach((s,n)=>{let x=document.createElement('section');x.className='slide';x.innerHTML=`<div class="top"><span>${s.k}</span><b>${s.t}</b></div><div class="stage">${s.h}</div><div class="bottom"><div class="attr">${s.a}<br><a class="src" target="_blank" rel="noopener" href="${s.u}">SOURCE ↗</a></div><div class="fn"><sup>[${n+1}]</sup>${s.f}</div></div>`;root.appendChild(x);let d=document.createElement('button');d.onclick=()=>go(n);dots.appendChild(d)});
const slides=[...document.querySelectorAll('.slide')],ds=[...dots.children];function render(){slides.forEach((s,n)=>s.classList.toggle('on',n===i));ds.forEach((d,n)=>d.classList.toggle('on',n===i));history.replaceState(null,'','#'+(i+1));document.title=String(i+1).padStart(2,'0')+' · '+S[i].t}function go(n){i=(n+S.length)%S.length;render()}addEventListener('keydown',e=>{if(['ArrowRight',' ','PageDown'].includes(e.key)){e.preventDefault();go(i+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(i-1)}else if(e.key==='Home'){go(0)}else if(e.key==='End'){go(S.length-1)}else if(e.key.toLowerCase()==='o'){window.open(S[i].u,'_blank')}else if(e.key.toLowerCase()==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()}});let sx=null,sy=null;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{if(sx===null)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.2)go(i+(dx<0?1:-1));sx=sy=null},{passive:true});render();
</script>
</body></html>
